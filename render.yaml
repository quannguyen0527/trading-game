# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: byou-trading-game
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One process only: rooms live in memory, so a second worker would split players apart.
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Turns on the AI coach. Set the value in the Render dashboard; it never goes in the repo.
      - key: ANTHROPIC_API_KEY
        sync: false
